name: DB migration

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Select the Environment
        options: [dev, uat, prod]

permissions:
  id-token: write
  contents: read

jobs:
  validate_environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.validate.outputs.environment }}
    steps:
      - name: Validate environment
        id: validate
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            dev|uat|prod)
              printf 'environment=%s\n' "$ENVIRONMENT" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported environment. Allowed values: dev, uat, prod."
              exit 1
              ;;
          esac

  db_migration:
    needs: validate_environment
    runs-on: [ self-hosted-job, "${{ needs.validate_environment.outputs.environment }}" ]
    name: DB migration
    environment: ${{ needs.validate_environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Set up JDK 17
        uses: actions/setup-java@b6e674f4b717d7b0ae3baee0fbe79f498905dfde # v1
        with:
          java-version: 17

      - name: Set up Maven
        uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f # v4.5
        with:
          maven-version: 3.8.2

      - name: Run Liquibase update
        env:
          OBSERVABILITY_DATASOURCE_URL: ${{ secrets.OBSERVABILITY_DATASOURCE_URL }}
          OBSERVABILITY_DATASOURCE_USERNAME: ${{ secrets.OBSERVABILITY_DATASOURCE_USERNAME }}
          OBSERVABILITY_DATASOURCE_PASSWORD: ${{ secrets.OBSERVABILITY_DATASOURCE_PASSWORD }}
        run: mvn -B process-resources liquibase:update
