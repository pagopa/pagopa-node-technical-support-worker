## DATABASE - OBSERVABILITY (payment monitoring projection)
###################
# Second PostgreSQL datasource holding the functional projection read model
# consumed by the observability API (see docs/spec in pagopa-nodo-obervability).
quarkus.datasource.observability.db-kind=postgresql
quarkus.datasource.observability.jdbc.url=${OBSERVABILITY_DATASOURCE_URL}
quarkus.datasource.observability.username=${OBSERVABILITY_DATASOURCE_USERNAME}
quarkus.datasource.observability.password=${OBSERVABILITY_DATASOURCE_PASSWORD}

quarkus.hibernate-orm.observability.datasource=observability
quarkus.hibernate-orm.observability.packages=it.gov.pagopa.nodetsworker.observability.repository.models
quarkus.hibernate-orm.observability.database.default-schema=${OBSERVABILITY_DATASOURCE_SCHEMA:observability}
quarkus.hibernate-orm.observability.log.sql=false

# Projection schema is owned by Liquibase (not Hibernate) and applied at startup on the
# observability datasource. Prerequisite: schema+role bootstrap (00-create-schema-and-user.sql).
quarkus.liquibase.observability.change-log=db/observability/db.changelog-master.yaml
quarkus.liquibase.observability.migrate-at-start=true
quarkus.liquibase.observability.default-schema-name=${OBSERVABILITY_DATASOURCE_SCHEMA:observability}

# Local projection: local PostgreSQL, schema managed by Liquibase at startup.
# Prerequisite: schema+role bootstrap (db/observability/00-create-schema-and-user.sql).
%dev.quarkus.datasource.observability.db-kind=postgresql
%dev.quarkus.datasource.observability.jdbc.url=${OBSERVABILITY_DATASOURCE_URL:jdbc:postgresql://localhost:5444/nodo?prepareThreshold=0&currentSchema=observability}
%dev.quarkus.datasource.observability.username=${OBSERVABILITY_DATASOURCE_USERNAME:observability}
%dev.quarkus.datasource.observability.password=${OBSERVABILITY_DATASOURCE_PASSWORD:password}
%dev.quarkus.hibernate-orm.observability.database.generation=none
%dev.quarkus.hibernate-orm.observability.database.default-schema=${OBSERVABILITY_DATASOURCE_SCHEMA:observability}
%dev.quarkus.liquibase.observability.migrate-at-start=true
%dev.quarkus.liquibase.observability.default-schema-name=${OBSERVABILITY_DATASOURCE_SCHEMA:observability}

