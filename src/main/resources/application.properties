###################
## OBSERVABILITY API
###################
# Window and pagination limits mirror the functional contract (mocks/).
observability.window.default-minutes=60
observability.window.max-days=60
observability.page.default-size=20
observability.page.max-size=100
observability.cursor.ttl-seconds=300
observability.sse.heartbeat-seconds=15
observability.sse.replay-limit=100
observability.sse.replay-ttl-seconds=300
observability.retention.days=60

# RE diagnostics are separate from projection ingestion and fail closed until deployment review.
observability.re.enabled=${OBSERVABILITY_RE_DIAGNOSTICS_ENABLED:false}
observability.re.endpoint=${RE_DATA_EXPLORER_URL:}
observability.re.client-id=${RE_DATA_EXPLORER_CLIENT_ID:}
observability.re.client-secret=${RE_DATA_EXPLORER_CLIENT_SECRET:}
observability.re.tenant-id=${RE_DATA_EXPLORER_TENANT_ID:}
observability.re.database=${RE_DATA_EXPLORER_DB_NAME:re}
# ADX table containing the RE events; must match the reviewed source schema.
observability.re.table=${RE_DATA_EXPLORER_TABLE:ReEvent}
# Stable, immutable technical row ID used with insertedTimestamp for deterministic seek pagination.
# Do not assume the RE uniqueId field uniquely identifies a source row.
observability.re.row-id-column=${RE_DATA_EXPLORER_ROW_ID_COLUMN:uniqueId}
# Actual source retention in days, used to clip query windows; 0 blocks activation (does not set ADX retention).
observability.re.retention-days=${RE_DATA_EXPLORER_RETENTION_DAYS:90}
# Manual deployment approvals, NOT automatic checks: every flag must be true before diagnostics can run.
# Confirms source column names/types and PA/NAV/token correlation semantics.
observability.re.schema-verified=true
# Confirms insertedTimestamp is the intended column for query windows. It holds Europe/Rome wall-clock
# time without offset (surfaced by ADX as datetime): windows and results are converted by ReTime.
observability.re.timezone-verified=true
# Confirms retention-days matches the actual source retention policy.
observability.re.retention-verified=true
# Confirms stable row IDs and timestamp/ID ordering support pagination without duplicates or omissions.
observability.re.ordering-verified=true
# Confirms ingestion_time() policy/visibility semantics make the fixed pagination watermark reliable.
observability.re.watermark-verified=true
# Confirms approval to expose potentially personal data in RE events and decoded payloads.
observability.re.personal-data-approved=true
# Query deadline in seconds, also applied to SDK/socket timeouts (allowed: 1-120).
observability.re.timeout-seconds=60
# Maximum events returned per page (allowed: 1-100).
observability.re.page-size=100
# Maximum events across all pages of one consultation (allowed: 1-1000).
observability.re.max-rows=1000
# Pagination cursor lifetime in seconds from the first request; not renewed by subsequent pages (1-300).
observability.re.cursor-ttl-seconds=300
# Maximum concurrent RE reads per application instance; excess requests fail immediately with 429 (1-32).
observability.re.max-concurrent=4
# Maximum admitted RE source reads per fixed UTC minute, per instance; excess requests return 429 (1-600).
observability.re.requests-per-minute=60
mp.openapi.filter=it.gov.pagopa.nodetsworker.observability.re.ReOpenApiFilter
# SDK/auth/wire diagnostics may contain parameters or event content; never enable them for RE.
quarkus.log.category."com.microsoft.azure.kusto".level=OFF
quarkus.log.category."com.microsoft.aad".level=OFF
quarkus.log.category."org.apache.http.wire".level=OFF
quarkus.log.category."org.apache.http.headers".level=OFF
# Retention sweep schedule (deletes attempts/payments past 60 days, expired inbox/anomaly, old outbox).
observability.retention.cleanup-cron=0 0 * * * ?
%test.observability.retention.cleanup-cron=off

# Primitive REQ/RESP pairing (spec §3.3.2): a request unanswered after the budget is a warning.
observability.primitives.response-budget-seconds=10
observability.primitives.pending-ttl-seconds=300
observability.primitives.sweep-interval=2s
%test.observability.primitives.sweep-interval=off

# Nodo monitoring (APIM): cache version of NDP001 and NDP004, selected via the X-Ndp-Target header.
quarkus.rest-client.nodo-monitoring.url=${NODO_MONITORING_URL:https://api.dev.platform.pagopa.it/nodo-monitoring}
quarkus.rest-client.nodo-monitoring.connect-timeout=2000
quarkus.rest-client.nodo-monitoring.read-timeout=5000
observability.monitoring.timeout-seconds=6
observability.monitoring.ndp001.target=${NODO_MONITORING_NDP001_TARGET:NDP001DEV}
observability.monitoring.ndp001.subscription-key=${NODO_MONITORING_NDP001_SUBSCRIPTION_KEY:${NODO_MONITORING_SUBSCRIPTION_KEY:}}
observability.monitoring.ndp004.target=${NODO_MONITORING_NDP004_TARGET:NDP004IT}
observability.monitoring.ndp004.subscription-key=${NODO_MONITORING_NDP004_SUBSCRIPTION_KEY:${NODO_MONITORING_SUBSCRIPTION_KEY:}}
# Seed the synthetic demo projection at startup (local only); never in production.
observability.seed.enabled=false

# RE (Registro Eventi) ingestion from Event Hubs — writes the projection + outbox (spec §4.1).
# Disabled by default; enable in the exercise env with the connection settings below.
observability.ingestion.enabled=${OBSERVABILITY_RE_INGESTION:false}
observability.ingestion.connection-string=${OBSERVABILITY_EVENTHUB_CONNECTION_STRING:}
observability.ingestion.event-hub-name=${OBSERVABILITY_EVENTHUB_NAME:}
observability.ingestion.consumer-group=${OBSERVABILITY_EVENTHUB_CONSUMER_GROUP:$Default}
observability.ingestion.checkpoint.storage-connection-string=${OBSERVABILITY_CHECKPOINT_STORAGE_CONNECTION_STRING:}
observability.ingestion.checkpoint.container=${OBSERVABILITY_CHECKPOINT_CONTAINER:observability-checkpoints}

